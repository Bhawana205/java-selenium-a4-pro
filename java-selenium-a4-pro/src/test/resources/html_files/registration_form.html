<html>
	<head>
		<title></title>
	</head>
    <body>
     	<h2>Desi Insta SignUp</h2>
    	<form>
    		<table>
    		    <tbody>
    		    	<tr>
    		            <td>Name : </td>
    		         	<td>
    		         		<input type="text" placeholder="enter full name here..">	
    		         	</td>    		         	   
    		        </tr>
    		        <tr>
    		        	<td>Username : </td>
    		        	<td>
    		        		<input type="text">
    		        	</td>
    		        </tr>
    		         <tr>
    		        	<td>Password : </td>
    		        	<td>
    		        		<input type="password">
    		        	</td>
    		        </tr>
    		         <tr>
    		        	<td>ConfirmPassword : </td>
    		        	<td>
    		        		<input type="password">
    		        	</td>
    		        </tr>
    		        <tr>
    		        	<td>Dob : </td>
    		        	<td>
    		        		<select id="date">
    		        			 <option value=""> Date</option>
                                 <option value="1">1</option>
                                 <option value="2">2</option>
                                 <option value="3">3</option>                               
                                 <option value="31">31</option>
    		        		</select>
    		        	    <select id="month">
    		        			  <option value="">Month</option>
                                  <option value="1">January</option>
                                  <option value="2">February</option>
                                  <option value="3">March</option>
                                  <option value="12">December</option>
    		        		</select>
    		        	    <select id="year">
                                   <option value="">Year</option>
                                   <option value="2024">2024</option>
                                   <option value="2025">2025</option>
                                   <option value="2026">2026</option>
                                   <option value="2027">2027</option>
                             </select>
    		        	</td>
    		        </tr>
    		        <tr>
    		        	<td>Email : </td>
    		        	<td>
    		        		<input type="email">
    		        	</td>
    		        </tr>
    		        <tr>
    		        	<td>BackupEmail : </td>
    		        	<td>
    		        		<input type="email">
    		        	</td>
    		        </tr>
    		        <tr>
    		        	<td>Gender</td>
    		        	<td>
    		        		<input type="radio" id="male" name="Gender">
    		        		<label for="male">Male</label>
    		        		<input type="radio" id="female" name="Gender">
    		        		<label for="female">Female</label>
    		        		<input type="radio" id="other" name="Gender">
    		        		<label for="other">Other</label>
    		        	</td>
    		        </tr>
    		        <tr>
    		        	<td>PhoneNumber : </td>
    		        	<td>
                            <input type="tel" id="phone" name="phone">
    		        	</td>
    		        </tr>
    		         <tr>
    		        	<td>Alternate Number : </td>
    		        	<td>
                            <input type="tel" id="altphone" name="altphone">
    		        	</td>
    		        </tr>
    		        <tr>
    		        	<td>Profile Pic : </td>
    		        	<td>
    		        		<input type = "file" id="pic" name="pic">
    		        	</td>
    		        </tr>
    		        <tr>
    		        	<td>Bio : </td>
    		        	<td>
    		        		<textarea rows="4" cols="21"></textarea>
    		        	</td>
    		        </tr>
    		        <tr>
    		        	<td>ProfileType : </td>
    		        	<td>
    		        		<input type="radio" id="public" name="profile">
    		        		<label for="public">Public</label>
    		        		<input type="radio" id="private" name="profile">
    		        		<label for="private">Private</label>
    		        	</td>
    		        </tr>
    		        <tr>
    		        	<td>RelationshipStatus : </td>
    		        	<td>
    		        		<select id="status">
    		        		 	<option value="">select</option>
    		        	    	<option value="1">Married</option>
    		        	    	<option value="2">Single</option>
    		        	    	<option value="3">Complicated</option>
    		        		</select>
    		        	</td>
    		        </tr>
    		         <tr>
    		        	<td>Country : </td>
    		        	<td>
    		        		<select id="Country">
    		        		 	<option value="">select</option>
    		        	    	<option value="1">India</option>
    		        	    	<option value="2">Japan</option>
    	                        <option value="3">Pakistan</option>
    	                        <option value="4">China</option>
    		        	    	
    		        		</select>
    		        	</td>
    		        </tr>
    		         <tr>
    		        	<td>Hobbies : </td>
    		        	<td>
    		        		<textarea rows="4" cols="15"></textarea>
    		        	</td>
    		        </tr>
    		         <tr>
    		        	<td>Language : </td>
    		        	<td>
    		        		<select id="Language">
    		        		 	<option value="">select</option>
    		        	    	<option value="1">Hindi</option>
    		        	    	<option value="2">English</option>
    	                        <option value="3">Urdu</option>
    	                        <option value="4">Chinese</option>
    		        	    	
    		        		</select>
    		        	</td>
    		        </tr>
    		         <tr>
    		        	<td>Religion : </td>
    		        	<td>
    		        		<select id="Religion">
    		        		 	<option value="">Hindu</option>
    		        	    	<option value="1">Christian</option>
    		        	    	<option value="2">Muslim</option>
    	                        <option value="3">Sikh</option>    		        	    	
    		        		</select>
    		        	</td>
    		        </tr>
    		        <tr>
    		        	<td>Terms&Conditions</td>
    		        	<td>
    		        		<input type="checkbox" id="check">
    		        	</td>
    		        </tr>
    		        <tr>
    		        	<td>
    		        		<input type="submit" value="Submit">
                            <input type="reset" value="Reset">
    		        	</td>
    		        </tr>
    		    </tbody>
    		</table>    	    	
    	</form>
    </body>
</html>
